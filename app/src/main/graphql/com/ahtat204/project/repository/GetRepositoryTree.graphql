
query GetRepositoryTree($projectPath:ID!,$treePath: String!,$branch:String){
    project(fullPath: $projectPath){
        repository{
            tree(ref: $branch,path: $treePath){
                lastCommit(ref: $branch){
                    message
                    committedDate
                    author {
                        name
                    }
                }
                trees(first: 10){
                    __typename

                    nodes {
                        id
                        name
                        path

                    }
                    pageInfo {
                        startCursor
                    }
                    edges {
                        cursor
                    }
                }
                blobs(first: 10 ){
                    nodes {
                        id
                        name
                        path
                    }
                    pageInfo {
                        startCursor
                    }
                    edges {
                        cursor
                        node {
                            id
                            path
                            name
                        }
                    }
                }
            }
        }
    }
}