name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build-test:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Create secrets file
        run: |
          echo "CLIENT_ID=20302211ABH62HY6" > $GITHUB_WORKSPACE/secrets.properties
      - name: cache tree-sitter
        uses: actions/cache@v4
        id: cache-tree-sitter
        with:
          path: /home/runner/work/Gitlab/native-libs
          key: ${{ runner.os }}-treeSitter-v1-${{ hashFiles('/home/runner/work/Gitlab/native-libs') }}
          restore-keys: |
            ${{ runner.os }}-treeSitter-
      - name: create properties file
        run: |
          touch $GITHUB_WORKSPACE/local.properties
          echo "treesitter.dir=/home/runner/work/Gitlab/native-libs" > local.properties
      - name: clone tree-sitter
        if: steps.cache-tree-sitter.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/tree-sitter/tree-sitter.git /home/runner/work/Gitlab/native-libs/tree-sitter
          git clone https://github.com/tree-sitter/tree-sitter-json /home/runner/work/Gitlab/native-libs/tree-sitter-json
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Cache GraphQL Schema
        id: cache-schema
        uses: actions/cache@v4
        with:
          path: app/src/main/graphql/com/ahtat204/gitlab/schema.graphqls
          key: ${{ runner.os }}-graphql-v1-${{ hashFiles('app/src/main/graphql/com/ahtat204/gitlab/schema.graphqls') }}
          restore-keys: |
            ${{ runner.os }}-graphql-schema-

      - name: Download Schema
        if: steps.cache-schema.outputs.cache-hit != 'true'
        run: ./gradlew :app:downloadGitlabApolloSchemaFromIntrospection

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew clean build
      - run: echo "Build status report=${{ job.status }}"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests
        run: ./gradlew test --stacktrace
